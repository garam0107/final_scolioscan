services:
  db:
    image: mysql:8.0
    container_name: nextvine-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextvine
      MYSQL_USER: nextvine
      MYSQL_PASSWORD: nextvine
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextvine-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://nextvine:nextvine@db:3306/nextvine?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ais-api:
    build:
      context: ./AIS-API
      dockerfile: Dockerfile
    container_name: ais-api
    ports:
      - "8002:8000"

volumes:
  mysql_data:
